# /etc/ssh/sshd_config.d/10-fsd.conf — matriz do fsd
# Só chave, sem root, e só a partir da tailnet (100.64.0.0/10) ou da própria máquina.
# Sem ListenAddress: o sshd sobe antes da Tailscale no boot; o AllowUsers filtra a origem.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers __FSD_USER__@100.64.0.0/10 __FSD_USER__@127.0.0.1 __FSD_USER__@::1   # troque __FSD_USER__ pelo seu usuário
